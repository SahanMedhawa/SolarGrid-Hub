<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - Smart Solar Microgrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="bi bi-sun-fill me-2"></i>Smart Solar Microgrid</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4"><i class="bi bi-calendar-check-fill me-2"></i>Reservations</h2>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Filter by Status</label>
                        <select class="form-select" id="resStatusFilter" onchange="loadReservations()">
                            <option value="">All</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reservations Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Prosumer NIC</th>
                                <th>Node</th>
                                <th>Date</th>
                                <th>Energy (kWh)</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTable">
                            <tr><td colspan="7" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Smart Solar Microgrid Trading System | SE4040 EAD</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        requireAuth();

        // Loads reservations, optionally filtered by status.
        async function loadReservations() {
            try {
                const status = document.getElementById('resStatusFilter').value;
                const endpoint = status ? `reservation/status/${status}` : 'reservation';
                const reservations = await apiRequest(endpoint);
                const tbody = document.getElementById('reservationsTable');

                tbody.innerHTML = reservations.map(r => `
                    <tr>
                        <td><small>${r.id.substring(0, 8)}...</small></td>
                        <td>${r.prosumerNic}</td>
                        <td>${r.nodeId.substring(0, 8)}...</td>
                        <td>${new Date(r.reservationDate).toLocaleDateString()}</td>
                        <td>${r.energyKWh}</td>
                        <td><span class="${getStatusBadge(r.status)}">${r.status}</span></td>
                        <td>
                            ${r.status === 'Pending' ? `<button class="btn btn-sm btn-success" onclick="approveRes('${r.id}')"><i class="bi bi-check"></i> Approve</button>` : ''}
                            ${r.status === 'Pending' ? `<button class="btn btn-sm btn-danger" onclick="cancelRes('${r.id}')"><i class="bi bi-x"></i> Cancel</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Approves a pending reservation.
        async function approveRes(id) {
            try {
                await apiRequest(`reservation/${id}/approve`, 'PUT');
                showToast('Reservation approved!');
                loadReservations();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Cancels a reservation.
        async function cancelRes(id) {
            if (!confirm('Cancel this reservation?')) return;
            try {
                await apiRequest(`reservation/${id}/cancel`, 'PUT');
                showToast('Reservation cancelled!');
                loadReservations();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        loadReservations();
    </script>
</body>
</html>
