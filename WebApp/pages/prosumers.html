<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosumer Management - Smart Solar Microgrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="bi bi-sun-fill me-2"></i>Smart Solar Microgrid</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4"><i class="bi bi-person-badge me-2"></i>Prosumer Management</h2>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Filter by Status</label>
                        <select class="form-select" id="statusFilter" onchange="loadProsumers()">
                            <option value="">All</option>
                            <option value="Pending">Pending</option>
                            <option value="Active">Active</option>
                            <option value="Deactivated">Deactivated</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Prosumers Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>NIC</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="prosumersTable">
                            <tr><td colspan="6" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Smart Solar Microgrid Trading System | SE4040 EAD</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        requireAuth();

        // Loads prosumers from the API, optionally filtered by status.
        async function loadProsumers() {
            try {
                const status = document.getElementById('statusFilter').value;
                const endpoint = status ? `prosumer/status/${status}` : 'prosumer';
                const prosumers = await apiRequest(endpoint);
                const tbody = document.getElementById('prosumersTable');
                const user = getUser();

                tbody.innerHTML = prosumers.map(p => `
                    <tr>
                        <td>${p.nic}</td>
                        <td>${p.firstName} ${p.lastName}</td>
                        <td>${p.email}</td>
                        <td>${p.phone}</td>
                        <td><span class="${getStatusBadge(p.status)}">${p.status}</span></td>
                        <td>
                            ${p.status === 'Pending' && user.role === 'Backoffice' ? `<button class="btn btn-sm btn-success" onclick="activateProsumer('${p.nic}')"><i class="bi bi-check-circle"></i> Activate</button>` : ''}
                            ${p.status === 'Deactivated' && user.role === 'Backoffice' ? `<button class="btn btn-sm btn-primary" onclick="activateProsumer('${p.nic}')"><i class="bi bi-arrow-counterclockwise"></i> Reactivate</button>` : ''}
                            ${p.status === 'Active' ? `<button class="btn btn-sm btn-outline-danger" onclick="deactivateProsumer('${p.nic}')"><i class="bi bi-x-circle"></i> Deactivate</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Activates a prosumer account.
        async function activateProsumer(nic) {
            try {
                await apiRequest(`prosumer/${nic}/activate`, 'PUT');
                showToast('Prosumer activated!');
                loadProsumers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Deactivates a prosumer account.
        async function deactivateProsumer(nic) {
            if (!confirm('Deactivate this prosumer?')) return;
            try {
                await apiRequest(`prosumer/${nic}/deactivate`, 'PUT');
                showToast('Prosumer deactivated!');
                loadProsumers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        loadProsumers();
    </script>
</body>
</html>
