<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Solar Microgrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-sun-fill display-3 text-success"></i>
                            <h3 class="mt-2">Smart Solar Microgrid</h3>
                            <p class="text-muted">Sign in to continue</p>
                        </div>

                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginType" class="form-label">Account type</label>
                                <select class="form-select" id="loginType">
                                    <option value="User">Admin / Grid Operator</option>
                                    <option value="Prosumer">Prosumer (NIC)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label" id="usernameLabel">Username</label>
                                <input type="text" class="form-control" id="username" required
                                       placeholder="Enter your username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required
                                       placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            New to the microgrid? <a href="register.html">Create a prosumer account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // Handles the login form submission.
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginType = document.getElementById('loginType').value;
            const errorAlert = document.getElementById('errorAlert');

            errorAlert.classList.add('d-none');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        loginType: loginType
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                setAuth(data.token, {
                    userId: data.userId,
                    role: data.role,
                    displayName: data.displayName
                });

if (data.role === 'Prosumer') {
                    clearAuth();
                    errorAlert.className = 'alert alert-info';
                    errorAlert.textContent = 'Prosumer login successful. The web portal is for administrators and grid operators; use the mobile app for prosumer features.';
                    errorAlert.classList.remove('d-none');
                    return;
                }

                window.location.href = 'dashboard.html';
            } catch (error) {
                errorAlert.className = 'alert alert-danger';
                errorAlert.textContent = error.message;
                errorAlert.classList.remove('d-none');
            }
        });

        document.getElementById('loginType').addEventListener('change', (event) => {
            const isProsumer = event.target.value === 'Prosumer';
            document.getElementById('usernameLabel').textContent = isProsumer ? 'NIC number' : 'Username';
            document.getElementById('username').placeholder = isProsumer ? 'Enter your NIC number' : 'Enter your username';
        });
    </script>
</body>
</html>
