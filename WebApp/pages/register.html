<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Solar Microgrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card shadow">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-sun-fill display-3 text-success"></i>
                            <h3 class="mt-2">Join the Smart Solar Microgrid</h3>
                            <p class="text-muted mb-0">Create a prosumer account to participate in clean energy trading.</p>
                        </div>

                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
                        <div id="successAlert" class="alert alert-success d-none" role="alert"></div>

                        <form id="registrationForm" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nic" class="form-label">NIC number</label>
                                    <input type="text" class="form-control" id="nic" required autocomplete="off">
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone number</label>
                                    <input type="tel" class="form-control" id="phone" required autocomplete="tel">
                                </div>
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">First name</label>
                                    <input type="text" class="form-control" id="firstName" required autocomplete="given-name">
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Last name</label>
                                    <input type="text" class="form-control" id="lastName" required autocomplete="family-name">
                                </div>
                                <div class="col-12">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="email" required autocomplete="email">
                                </div>
                                <div class="col-12">
                                    <label for="address" class="form-label">Address</label>
                                    <textarea class="form-control" id="address" rows="2" required autocomplete="street-address"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" minlength="6" required autocomplete="new-password">
                                    <div class="form-text">Use at least 6 characters.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label">Confirm password</label>
                                    <input type="password" class="form-control" id="confirmPassword" minlength="6" required autocomplete="new-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 mt-4" id="registerButton">
                                <i class="bi bi-person-plus-fill me-2"></i>Create account
                            </button>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            Already have an account? <a href="login.html">Sign in</a>
                        </p>
                    </div>
                </div>
                <p class="text-center mt-3"><a href="../index.html" class="text-decoration-none">Back to home</a></p>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        const registrationForm = document.getElementById('registrationForm');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const registerButton = document.getElementById('registerButton');

        registrationForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorAlert.classList.add('d-none');
            successAlert.classList.add('d-none');

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!registrationForm.checkValidity()) {
                registrationForm.classList.add('was-validated');
                return;
            }

            if (password !== confirmPassword) {
                errorAlert.textContent = 'Passwords do not match.';
                errorAlert.classList.remove('d-none');
                return;
            }

            registerButton.disabled = true;
            registerButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Creating account...';

            try {
                const response = await fetch(`${API_BASE_URL}/prosumer/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nic: document.getElementById('nic').value.trim(),
                        firstName: document.getElementById('firstName').value.trim(),
                        lastName: document.getElementById('lastName').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        phone: document.getElementById('phone').value.trim(),
                        address: document.getElementById('address').value.trim(),
                        password
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Registration failed. Please try again.');
                }

                registrationForm.reset();
                registrationForm.classList.remove('was-validated');
                successAlert.textContent = 'Your account was created and is pending approval. You can sign in after it has been activated.';
                successAlert.classList.remove('d-none');
            } catch (error) {
                errorAlert.textContent = error.message;
                errorAlert.classList.remove('d-none');
            } finally {
                registerButton.disabled = false;
                registerButton.innerHTML = '<i class="bi bi-person-plus-fill me-2"></i>Create account';
            }
        });
    </script>
</body>
</html>
