<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Nodes - Smart Solar Microgrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="bi bi-sun-fill me-2"></i>Smart Solar Microgrid</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-diagram-3-fill me-2"></i>Microgrid Nodes</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#nodeModal" onclick="resetNodeForm()" id="addNodeBtn" style="display:none;">
                <i class="bi bi-plus-circle me-1"></i>Add Node
            </button>
        </div>

        <!-- Nodes Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Location</th>
                                <th>Capacity (kWh)</th>
                                <th>Battery Slots</th>
                                <th>Schedule</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="nodesTable">
                            <tr><td colspan="7" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Node Modal -->
    <div class="modal fade" id="nodeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="nodeModalTitle">Add Node</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="nodeForm">
                        <input type="hidden" id="nodeId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Node Name</label>
                                <input type="text" class="form-control" id="nodeName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" id="nodeLocation" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Latitude</label>
                                <input type="number" step="any" class="form-control" id="nodeLatitude" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Longitude</label>
                                <input type="number" step="any" class="form-control" id="nodeLongitude" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Capacity (kWh)</label>
                                <input type="number" step="0.1" class="form-control" id="nodeCapacity" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Battery Slots</label>
                                <input type="number" class="form-control" id="nodeBatterySlots" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Schedule</label>
                                <input type="text" class="form-control" id="nodeSchedule" placeholder="e.g. 06:00-18:00" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="saveNode()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Smart Solar Microgrid Trading System | SE4040 EAD</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        requireAuth();

        // Show add button for Backoffice users.
        const user = getUser();
        if (user && user.role === 'Backoffice') {
            document.getElementById('addNodeBtn').style.display = 'block';
        }

        // Loads all microgrid nodes.
        async function loadNodes() {
            try {
                const nodes = await apiRequest('microgridnode');
                const tbody = document.getElementById('nodesTable');

                tbody.innerHTML = nodes.map(n => `
                    <tr>
                        <td>${n.nodeName}</td>
                        <td>${n.location}</td>
                        <td>${n.capacityKWh}</td>
                        <td>${n.availableBatterySlots} / ${n.batterySlots}</td>
                        <td>${n.schedule}</td>
                        <td><span class="${n.isActive ? 'badge bg-success' : 'badge bg-danger'}">${n.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editNode('${n.id}')"><i class="bi bi-pencil"></i></button>
                            ${n.isActive && user.role === 'Backoffice' ? `<button class="btn btn-sm btn-outline-danger" onclick="deactivateNode('${n.id}')"><i class="bi bi-x-circle"></i></button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Resets the node form.
        function resetNodeForm() {
            document.getElementById('nodeModalTitle').textContent = 'Add Node';
            document.getElementById('nodeForm').reset();
            document.getElementById('nodeId').value = '';
        }

        // Populates form for editing.
        async function editNode(id) {
            try {
                const node = await apiRequest(`microgridnode/${id}`);
                document.getElementById('nodeModalTitle').textContent = 'Edit Node';
                document.getElementById('nodeId').value = node.id;
                document.getElementById('nodeName').value = node.nodeName;
                document.getElementById('nodeLocation').value = node.location;
                document.getElementById('nodeLatitude').value = node.latitude;
                document.getElementById('nodeLongitude').value = node.longitude;
                document.getElementById('nodeCapacity').value = node.capacityKWh;
                document.getElementById('nodeBatterySlots').value = node.batterySlots;
                document.getElementById('nodeSchedule').value = node.schedule;

                new bootstrap.Modal(document.getElementById('nodeModal')).show();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Saves node data.
        async function saveNode() {
            const id = document.getElementById('nodeId').value;
            const data = {
                nodeName: document.getElementById('nodeName').value,
                location: document.getElementById('nodeLocation').value,
                latitude: parseFloat(document.getElementById('nodeLatitude').value),
                longitude: parseFloat(document.getElementById('nodeLongitude').value),
                capacityKWh: parseFloat(document.getElementById('nodeCapacity').value),
                batterySlots: parseInt(document.getElementById('nodeBatterySlots').value),
                availableBatterySlots: parseInt(document.getElementById('nodeBatterySlots').value),
                schedule: document.getElementById('nodeSchedule').value
            };

            try {
                if (id) {
                    await apiRequest(`microgridnode/${id}`, 'PUT', data);
                    showToast('Node updated!');
                } else {
                    await apiRequest('microgridnode', 'POST', data);
                    showToast('Node created!');
                }
                bootstrap.Modal.getInstance(document.getElementById('nodeModal')).hide();
                loadNodes();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Deactivates a node.
        async function deactivateNode(id) {
            if (!confirm('Deactivate this node? This will fail if active reservations exist.')) return;
            try {
                await apiRequest(`microgridnode/${id}`, 'DELETE');
                showToast('Node deactivated!');
                loadNodes();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        loadNodes();
    </script>
</body>
</html>
