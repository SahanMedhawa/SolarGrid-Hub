<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Smart Solar Microgrid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="bi bi-sun-fill me-2"></i>Smart Solar Microgrid</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people-fill me-2"></i>User Management</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#userModal" onclick="resetForm()">
                <i class="bi bi-plus-circle me-1"></i>Add User
            </button>
        </div>

        <!-- Users Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr><td colspan="6" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalTitle">Add User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label for="formUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="formUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="formEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="formEmail" required>
                        </div>
                        <div class="mb-3" id="passwordField">
                            <label for="formPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="formPassword">
                        </div>
                        <div class="mb-3">
                            <label for="formRole" class="form-label">Role</label>
                            <select class="form-select" id="formRole" required>
                                <option value="Backoffice">Backoffice</option>
                                <option value="GridOperator">Grid Operator</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="saveUser()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Smart Solar Microgrid Trading System | SE4040 EAD</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script>
        requireAuth();

        // Loads users from the API and renders the table.
        async function loadUsers() {
            try {
                const users = await apiRequest('user');
                const tbody = document.getElementById('usersTable');

                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>${u.username}</td>
                        <td>${u.email}</td>
                        <td><span class="badge bg-info">${u.role}</span></td>
                        <td><span class="${u.isActive ? 'badge bg-success' : 'badge bg-danger'}">${u.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editUser('${u.id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${u.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Resets the user form for creating a new user.
        function resetForm() {
            document.getElementById('modalTitle').textContent = 'Add User';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('passwordField').style.display = 'block';
        }

        // Populates the form for editing an existing user.
        async function editUser(id) {
            try {
                const user = await apiRequest(`user/${id}`);
                document.getElementById('modalTitle').textContent = 'Edit User';
                document.getElementById('userId').value = user.id;
                document.getElementById('formUsername').value = user.username;
                document.getElementById('formEmail').value = user.email;
                document.getElementById('formRole').value = user.role;
                document.getElementById('passwordField').style.display = 'none';

                new bootstrap.Modal(document.getElementById('userModal')).show();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Saves a new or updated user.
        async function saveUser() {
            const id = document.getElementById('userId').value;
            const data = {
                username: document.getElementById('formUsername').value,
                email: document.getElementById('formEmail').value,
                role: document.getElementById('formRole').value
            };

            try {
                if (id) {
                    await apiRequest(`user/${id}`, 'PUT', data);
                    showToast('User updated successfully!');
                } else {
                    data.password = document.getElementById('formPassword').value;
                    await apiRequest('user', 'POST', data);
                    showToast('User created successfully!');
                }

                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Deactivates a user.
        async function deleteUser(id) {
            if (!confirm('Are you sure you want to deactivate this user?')) return;
            try {
                await apiRequest(`user/${id}`, 'DELETE');
                showToast('User deactivated successfully!');
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        loadUsers();
    </script>
</body>
</html>
