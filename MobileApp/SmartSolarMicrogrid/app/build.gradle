plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapboxAccessToken = localProperties.getProperty("MAPBOX_ACCESS_TOKEN") ?: System.getenv("MAPBOX_ACCESS_TOKEN") ?: "YOUR_MAPBOX_PUBLIC_TOKEN"

android {
    namespace 'com.smartsolar.microgrid'
    compileSdk 34
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.smartsolar.microgrid"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "mapbox_access_token", mapboxAccessToken
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google Play Services Location
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Mapbox Maps SDK for Android
    implementation 'com.mapbox.maps:android-ndk27:11.32.0'

    // ZXing for QR Code generation and barcode scanning
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // JSON parsing
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Auto-configure ADB reverse port forwarding for connected devices
afterEvaluate {
    tasks.matching { it.name.startsWith("install") || it.name.startsWith("assemble") }.configureEach { task ->
        task.doLast {
            try {
                def adb = android.getAdbExecutable()?.absolutePath
                if (adb && new File(adb).exists()) {
                    project.exec {
                        commandLine adb, 'reverse', 'tcp:5000', 'tcp:5000'
                        ignoreExitValue = true
                    }
                }
            } catch (Exception ignored) { }
        }
    }
}
